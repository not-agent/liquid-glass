<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textFade" x1="240" y1="130" x2="1040" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A3A3A3"/>
    </linearGradient>
    <linearGradient id="edgeGlow" x1="320" y1="260" x2="960" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF4B4B" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#44FF9A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4B7CFF" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glassShadow" x="273" y="213" width="734" height="294" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#FFFFFF" flood-opacity="0.08"/>
    </filter>
    <filter id="softBlur" x="0" y="0" width="1280" height="720" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#050505"/>

  <g opacity="0.92" filter="url(#softBlur)">
    <text x="142" y="162" fill="url(#textFade)" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="600">Liquid Glass for interface chrome</text>
    <text x="142" y="230" fill="#D4D4D4" font-family="Inter, Arial, sans-serif" font-size="34">Use SVG displacement filters with backdrop-filter.</text>
    <text x="142" y="300" fill="#E5E5E5" font-family="Inter, Arial, sans-serif" font-size="34">Behind the panel, text refracts into separate color channels.</text>
    <text x="142" y="370" fill="#D4D4D4" font-family="Inter, Arial, sans-serif" font-size="34">Works well for nav bars, toolbars, and compact overlays.</text>
    <text x="142" y="440" fill="#E5E5E5" font-family="Inter, Arial, sans-serif" font-size="34">Chromium gets the full effect; other browsers get a fallback.</text>
    <text x="142" y="510" fill="#D4D4D4" font-family="Inter, Arial, sans-serif" font-size="34">Install the Astro adapter or use the core mount API.</text>
  </g>

  <g filter="url(#glassShadow)">
    <rect x="302" y="242" width="676" height="236" rx="28" fill="#000000" fill-opacity="0.36"/>
    <rect x="303" y="243" width="674" height="234" rx="27" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
    <path d="M334 290H946" stroke="#FFFFFF" stroke-opacity="0.17" stroke-width="2"/>
    <path d="M334 430H946" stroke="#FFFFFF" stroke-opacity="0.11" stroke-width="2"/>
    <path d="M320 261C428 304 494 315 642 314C788 313 861 295 960 265" stroke="url(#edgeGlow)" stroke-width="14" stroke-linecap="round" opacity="0.32"/>
    <path d="M321 461C433 417 508 405 645 405C784 405 866 422 959 456" stroke="url(#edgeGlow)" stroke-width="12" stroke-linecap="round" opacity="0.22"/>
  </g>

  <g opacity="0.88">
    <text x="365" y="353" fill="#FF7A7A" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="600">Liquid</text>
    <text x="469" y="353" fill="#72FFAD" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="600">Glass</text>
    <text x="565" y="353" fill="#7EA1FF" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="600">refracts</text>
    <text x="704" y="353" fill="#F5F5F5" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="600">background content</text>
    <text x="365" y="405" fill="#FAFAFA" font-family="Inter, Arial, sans-serif" font-size="26">Astro component + tiny browser runtime</text>
  </g>
</svg>
